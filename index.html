<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица расписания</title>
</head>
<body>
    
<table>
<caption>Расписание занятий и активностей на неделю</caption>
<thead>
<tr>
    <th scope="col">День недели</th>
    <th scope="col">Время</th>
    <th scope="col">Активность</th>
</tr>
</thead>
<tbody>
<tr>
    <th scope="row">Понедельник</th>
    <td>19:00-20:00</td>
    <td>Теннис</td>
</tr>
<tr>
    <th scope="row">Вторник</th>
    <td>20:00-22:00</td>
    <td>Урок по Frontend</td>
</tr>
<tr>
    <th scope="row">Среда</th>
    <td>19:00-20:00</td>
    <td>Теннис</td>
</tr>
<tr>
    <th scope="row">Четверг</th>
    <td>20:00-21:30</td>
    <td>Китайский язык</td>
</tr>
<tr>
    <th scope="row">Пятница</th>
    <td>20:00-22:00</td>
    <td>Урок по Frontend</td>
</tr>
</tbody>
</table>

</body>
</html>
